  <style>
    .gs-header { padding: 0 !important; position: sticky; top: 0; z-index: 100000; background: var(--gs-header-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .gs-header-inner {
      display: flex !important;
      align-items: center;
      justify-content: flex-start !important;
      max-width: var(--site-max-width, 1240px);
      height: 68px;
      margin: 0 auto;
      padding: 0 var(--site-gutter, 40px) !important;
      gap: 32px;
    }
    .gs-logo { flex-shrink: 0; color: var(--text); }
    .gs-logo .logo-svg { height: 18px; width: 165px; display: block; }
    .gs-nav { display: flex; gap: 26px; }
    .gs-nav a { font-size: 15px; font-weight: 600; color: var(--text-muted); text-decoration: none; white-space: nowrap; padding: 4px 0; position: relative; }
    .gs-nav a:hover, .gs-nav a.active { color: var(--primary); }
    .gs-nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -23px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }
    .gs-status { margin-left: 0; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    @media (max-width: 1120px) { .gs-status { display: none; } .gs-header-inner { gap: 22px; } .gs-nav { gap: 18px; } }
    .gs-search { position: relative; flex-shrink: 0; width: 240px; margin-left: auto; }
    .gs-search .search-box {
      display: flex;
      align-items: center;
      height: 36px;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 12px;
      transition: border-color 0.15s;
    }
    .gs-search .search-box:focus-within { border-color: var(--primary); background: var(--card); }
    .gs-search .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
    }
    .gs-search .search-input::placeholder { color: var(--text-muted); }
    .gs-search .search-btn {
      background: transparent;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }
    .gs-search .search-btn svg { width: 18px; height: 18px; }
    .gs-search .search-dropdown {
      position: absolute !important;
      top: calc(100% + 4px) !important;
      left: 0 !important;
      right: 0 !important;
      transform: none !important;
      width: 100% !important;
      max-width: none !important;
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      display: none;
      z-index: 99999 !important;
      max-height: 400px !important;
      overflow-y: auto;
      box-shadow: var(--shadow-lg) !important;
      margin-top: 0 !important;
    }
    .gs-search .search-dropdown.active { display: block; }

      .gs-header { display: none !important; }

    <script>
    // 최근 본 게임 저장
    (function() {
      const RECENT_KEY = 'gamerscroll_recent_searches';
      const MAX_RECENT = 8;
      const gameInfo = { name: 'The King is Watching', slug: 'the-king-is-watching', icon: 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2753900/d99f6a00d84ef3afdc5a804528e4c8a5bcdb868c/capsule_231x87_alt_assets_2.jpg?t=1773666354' };
      try {
        let recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
        recent = recent.filter(g => g.slug !== gameInfo.slug);
        recent.unshift(gameInfo);
        recent = recent.slice(0, MAX_RECENT);
        localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
      } catch (e) {}
    })();

    // 실시간 모바일 순위 탭 전환
    (function() {
      const section = document.querySelector('.realtime-rank-section');
      if (!section) return;

      let activeCat = 'grossing';
      let activeView = 'summary';
      let activeMarket = 'ios';
      const activeRegions = new Set(['kr', 'jp', 'us', 'cn', 'tw']);

      const legendRow = section.querySelector('.realtime-legend-row');

	      function updateContent() {
	        section.querySelectorAll('.realtime-content').forEach(c => {
	          const isCat = c.dataset.realtimeCat === activeCat;
	          const isView = c.dataset.realtimeView === activeView;
	          c.classList.toggle('active', isCat && isView);
	        });
	        // 실시간 뷰일 때만 범례 표시
	        if (legendRow) {
	          legendRow.classList.toggle('is-hidden', activeView !== 'realtime');
	        }
	      }

      function updateMarket() {
        section.querySelectorAll('.chart-market-svg').forEach(el => {
          el.classList.toggle('active', el.dataset.market === activeMarket);
        });
      }

      function updateRegions() {
        section.querySelectorAll('[data-region]').forEach(el => {
          const visible = activeRegions.has(el.dataset.region);
          el.style.opacity = visible ? '1' : '0';
          el.style.pointerEvents = visible ? 'auto' : 'none';
        });
      }

      // 카테고리 탭 (매출/인기)
      section.querySelectorAll('[data-realtime-cat]').forEach(tab => {
        if (tab.tagName === 'BUTTON') {
          tab.addEventListener('click', () => {
            activeCat = tab.dataset.realtimeCat;
            section.querySelectorAll('[data-realtime-cat]').forEach(t => {
              if (t.tagName === 'BUTTON') t.classList.toggle('active', t.dataset.realtimeCat === activeCat);
            });
            updateContent();
          });
        }
      });

      // 뷰 탭 (요약/실시간)
      section.querySelectorAll('[data-realtime-view]').forEach(tab => {
        if (tab.tagName === 'BUTTON' && !tab.disabled) {
          tab.addEventListener('click', () => {
            activeView = tab.dataset.realtimeView;
            section.querySelectorAll('[data-realtime-view]').forEach(t => {
              if (t.tagName === 'BUTTON') t.classList.toggle('active', t.dataset.realtimeView === activeView);
            });
            updateContent();
          });
        }
      });

      // 마켓 토글 (iOS/Android)
      section.querySelectorAll('[data-market-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMarket = btn.dataset.marketToggle;
          section.querySelectorAll('[data-market-toggle]').forEach(b => {
            b.classList.toggle('active', b.dataset.marketToggle === activeMarket);
          });
          updateMarket();
        });
      });

      // 범례 클릭 (국가 토글)
      section.querySelectorAll('.trend-legend-item').forEach(item => {
        item.addEventListener('click', () => {
          const region = item.dataset.legend;
          if (activeRegions.has(region)) {
            if (activeRegions.size > 1) {
              activeRegions.delete(region);
              item.classList.remove('active');
            }
          } else {
            activeRegions.add(region);
            item.classList.add('active');
          }
          updateRegions();
        });
      });

      updateContent();
      updateMarket();
      updateRegions();
    })();

    // 관련 콘텐츠 페이지네이션
    (function() {
      const container = document.querySelector('.game-related-container');
      if (!container) return;

      const items = container.querySelectorAll('.game-related-item');
      const perPage = parseInt(container.dataset.perPage) || 3;
      const total = parseInt(container.dataset.total) || items.length;
      const totalPages = Math.ceil(total / perPage);
      let currentPage = 0;

      const prevBtn = container.querySelector('.home-page-prev');
      const nextBtn = container.querySelector('.home-page-next');
      const pageInfo = container.querySelector('.home-page-info');

      function updateDisplay() {
        const start = currentPage * perPage;
        const end = start + perPage;
        items.forEach((item, i) => {
          item.style.display = (i >= start && i < end) ? '' : 'none';
        });
        if (pageInfo) pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
        if (prevBtn) prevBtn.disabled = currentPage === 0;
        if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (currentPage > 0) { currentPage--; updateDisplay(); }
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          if (currentPage < totalPages - 1) { currentPage++; updateDisplay(); }
        });
      }

      updateDisplay();
    })();
  </script>
